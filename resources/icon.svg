    <circle cx="728" cy="296" r="56" fill="#0d1328" stroke="#629eff" stroke-width="18"/>
    <circle cx="728" cy="296" r="22" fill="#e8f3ff"/>

    <circle cx="728" cy="728" r="56" fill="#0d1328" stroke="#7c5cff" stroke-width="18"/>
