<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191d36"/>
      <stop offset="55%" stop-color="#0f1326"/>
      <stop offset="100%" stop-color="#090c1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#5b46f6" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#1e2250" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090c1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38e8ff"/>
      <stop offset="50%" stop-color="#5698ff"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="205" fill="url(#bg)"/>
