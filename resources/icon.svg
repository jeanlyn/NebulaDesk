  <rect x="68" y="68" width="888" height="888" rx="201" fill="none" stroke="url(#rim)" stroke-width="8"/>
  <!-- Graph Constellation forming an abstract N -->
  <g stroke="url(#edge)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="296" y1="296" x2="296" y2="728"/>
    <line x1="296" y1="296" x2="728" y2="728"/>
    <line x1="296" y1="296" x2="584" y2="412"/>
    <line x1="584" y1="412" x2="728" y2="296"/>
    <line x1="584" y1="412" x2="728" y2="728"/>
    <line x1="728" y1="296" x2="728" y2="728"/>
  </g>
  <!-- Luminous Nodes -->
  <g>
    <circle cx="296" cy="296" r="56" fill="#0d1328" stroke="#38e8ff" stroke-width="18"/>
    <circle cx="296" cy="296" r="22" fill="#e6fbff"/>

    <circle cx="296" cy="728" r="56" fill="#0d1328" stroke="#4cc2ff" stroke-width="18"/>
    <circle cx="296" cy="728" r="22" fill="#e6f7ff"/>

    <circle cx="584" cy="412" r="50" fill="#0d1328" stroke="#5aa9ff" stroke-width="16"/>
