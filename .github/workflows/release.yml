name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -count=1 ./...

  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: darwin/arm64
            name: macos-arm64
            goflags: ""
          - runner: macos-latest
            platform: darwin/amd64
            name: macos-amd64
            goflags: ""
          - runner: ubuntu-latest
            platform: windows/amd64
            name: windows-amd64
            goflags: "-tags=mygo_nowebview"
          - runner: ubuntu-latest
            platform: linux/amd64
            name: linux-amd64
            goflags: ""
          - runner: ubuntu-latest
            platform: linux/arm64
            name: linux-arm64
            goflags: ""

    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: auto

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve Release Version
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Ensure App Icon Exists
        shell: bash
        run: |
          if [ ! -f resources/icon.png ]; then
            go run ./scripts/genicon -out resources/icon.png
          fi

      - name: Sync Version into mygo.json
        shell: bash
        run: |
          python3 -c '
          import json
          with open("mygo.json", "r", encoding="utf-8") as f:
              cfg = json.load(f)
          cfg["version"] = "${{ steps.ver.outputs.version }}"
          with open("mygo.json", "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2)
              f.write("\n")
          '

      - name: Build Native Package with MyGo
        shell: bash
        env:
          GOFLAGS: ${{ matrix.goflags }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          go run github.com/egoist/mygo/cmd/mygo@v0.10.0 build -platform "${{ matrix.platform }}"

          echo "=== Built outputs ==="
          find build -maxdepth 4 -ls 2>/dev/null || true

          ARCH_TAG="${{ matrix.name }}"
          VER_TAG="${{ steps.ver.outputs.tag }}"

          # Helper to guarantee unique platform/arch names when merging across matrix jobs
          copy_with_arch() {
            local src="$1"
            local base
            base="$(basename "$src")"
            local dest="$base"
            if [[ "$base" != *arm64* && "$base" != *amd64* && "$base" != *x86_64* && "$base" != *x64* && "$base" != *universal* ]]; then
              case "$base" in
                *.tar.gz) dest="${base%.tar.gz}-${ARCH_TAG}.tar.gz" ;;
                *.dmg)    dest="${base%.dmg}-${ARCH_TAG}.dmg" ;;
                *.zip)    dest="${base%.zip}-${ARCH_TAG}.zip" ;;
                *.exe)    dest="${base%.exe}-${ARCH_TAG}.exe" ;;
                *.deb)    dest="${base%.deb}-${ARCH_TAG}.deb" ;;
                *.rpm)    dest="${base%.rpm}-${ARCH_TAG}.rpm" ;;
                *)        dest="${base}-${ARCH_TAG}" ;;
              esac
            fi
            cp "$src" "release-assets/${dest}"
          }

          # Collect packaged distributables (POSIX find — compatible with macOS Bash 3.2)
          while IFS= read -r -d '' f; do
            copy_with_arch "$f"
          done < <(find build -maxdepth 4 -type f \( \
            -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o \
            -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.AppImage' \
          \) ! -path '*.app/*' -print0)

          # On macOS, if no .dmg was produced, zip the .app bundle directly
          if [[ "${{ matrix.platform }}" == darwin/* ]] && ! ls release-assets/*.dmg >/dev/null 2>&1; then
            while IFS= read -r -d '' appdir; do
              zipname="NebulaDesk-${VER_TAG}-${ARCH_TAG}.app.zip"
              (cd "$(dirname "$appdir")" && ditto -c -k --sequesterRsrc --keepParent "$(basename "$appdir")" "${GITHUB_WORKSPACE}/release-assets/${zipname}")
            done < <(find build -maxdepth 4 -type d -name '*.app' -print0)
          fi

          # Fallback: if mygo build produced a bare binary without an archive, package it cleanly
          if [ -z "$(ls -A release-assets)" ]; then
            IFS='/' read -r goos goarch <<< "${{ matrix.platform }}"
            ext=""
            ldflags="-s -w"
            if [ "$goos" = "windows" ]; then
              ext=".exe"
              ldflags="-H=windowsgui -s -w"
            fi
            GOOS="$goos" GOARCH="$goarch" go build -ldflags="$ldflags" -o "release-assets/NebulaDesk-${VER_TAG}-${ARCH_TAG}${ext}" .
          fi

          ls -lh release-assets/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: release-assets/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: all-assets
          merge-multiple: true

      - name: Generate Checksums
        shell: bash
        run: |
          cd all-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: NebulaDesk ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: all-assets/*
          body: |
            ## NebulaDesk ${{ github.event.inputs.tag || github.ref_name }}

            Pure-Go, GPU-accelerated native desktop client for **NebulaGraph v3** powered by [MyGo](https://mygo.run/) (`CGO_ENABLED=0`, zero Electron / zero WebView).

            ### Highlights
            - **Native GPU nGQL Editor**: Syntax highlighting, schema-aware autocompletion (`Ctrl+Space`), hover docs, multi-tab workspace, query history & snippets.
            - **Interactive Graph Visualization**: Force-directed (2D spatial-hash O(N)), Circular, Hierarchical Tree & Grid layouts; curved parallel & `@rank` edges; multi-tag vertex rings; minimap; SVG & JSON export.
            - **Safe Super-Node Exploration**: Strictly `LIMIT`-bounded directional expansion (`Both`, `Out →`, `← In`, `2-Hop`, configurable limit), plus live subgraph exploration from scalar table results.
            - **Multi-View Results & Schema**: Graph / Table / JSON / `EXPLAIN` Plan views, inline index indicators on Tag/Edge properties, and **EN / 中文** language switching.

            ### Downloads
            - **macOS (Apple Silicon / Intel)**: `.dmg` / `.app.zip`
            - **Windows (x64)**: `.exe` / `.zip`
            - **Linux (x64 / ARM64)**: `.tar.gz` / `.deb`
