name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-cross-build:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Run Unit & Headless UI Tests
        run: go test -count=1 -v ./...

      - name: Cross-Compile Verification (macOS / Windows / Linux)
        run: |
          GOOS=darwin  GOARCH=arm64 go build -o /tmp/nebuladesk-darwin-arm64 .
          GOOS=darwin  GOARCH=amd64 go build -o /tmp/nebuladesk-darwin-amd64 .
          GOOS=windows GOARCH=amd64 go build -tags mygo_nowebview -ldflags="-H=windowsgui -s -w" -o /tmp/nebuladesk-windows-amd64.exe .
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o /tmp/nebuladesk-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o /tmp/nebuladesk-linux-arm64 .
          ls -lh /tmp/nebuladesk-*
